name: CustomBlockGUI
version: '1.3.5'
main: com.customblocks.CustomBlockPlugin
api-version: '1.21'
author: CustomBlocks
description: Scale 2.0 per user (was 2.2 big) - Oraxen fix + placed full
prefix: CustomBlock

commands:
  givecustomblock:
    description: Give DiscoveryLab custom block (different texture per type)
    usage: /<command> <type> [player] [amount] | /<command> * for all
    permission: customblock.give
    permission-message: You don't have permission!
  customblock:
    description: Main command - /cb types|list|info
    usage: /<command>
    aliases: [cb]

permissions:
  customblock.give:
    description: Allow giving custom block
    default: op
  customblock.*:
    description: All permissions
    default: op
    children:
      customblock.give: true
